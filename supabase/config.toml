project_id = "thwnhgpjysykkoblbtrd"

[functions.ai-waiter]
verify_jwt = false

[functions.admin-login]
verify_jwt = false

[functions.admin-generate-access]
verify_jwt = false

# Valida o JWT do usuário por dentro (auth.getUser), pra devolver mensagens de
# erro próprias em vez do 401 genérico do gateway.
[functions.restaurant-finish-setup]
verify_jwt = false

# Relatório da aba "Análise" do portal mestre: valida o token de sessão do admin
# (emitido pelo admin-login) por dentro, então também roda sem JWT do Supabase.
[functions.admin-stats]
verify_jwt = false

# Primeiro acesso do restaurante: o e-mail novo é confirmado por link enviado
# via Resend (SMTP). "double_confirm_changes = false" é ESSENCIAL: com true o
# Supabase também pede confirmação no e-mail antigo, que aqui é o sintético
# do acesso provisório (nunca recebe nada) e o dono ficaria travado.
# No projeto hospedado isso se configura no Dashboard — ver README.
[auth.email]
enable_confirmations = true
double_confirm_changes = false

# Modelos de e-mail em português (HTML com a marca). No projeto hospedado, cole
# o conteúdo de cada arquivo em Authentication → Emails → Templates — ver README.
[auth.email.template.email_change]
subject = "Confirme seu e-mail no PapeiAI"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.recovery]
subject = "Redefina sua senha do PapeiAI"
content_path = "./supabase/templates/recovery.html"
