<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="../images/favicon.png" />
    <!-- apple-touch-icon: é o que o iOS usa pro ícone quando o cliente faz
         "Adicionar à Tela de Início" a partir do cardápio — Safari ignora o
         manifest.json pra isso, só olha esta tag. -->
    <link rel="apple-touch-icon" href="../images/favicon.png" />
    <link rel="manifest" href="../manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PapeiAI" />
    <!-- Avatar do Ari (garçom IA): pré-carregado pra já estar pronto quando o
         cliente abrir o chat, sem "pop-in" da imagem. -->
    <link rel="preload" as="image" href="../images/avatar.png" />
    <!-- viewport-fit=cover libera as variáveis env(safe-area-inset-*), usadas para
         não deixar a barra do carrinho/chat coladas no notch/home indicator do
         celular. Sem maximum-scale/user-scalable=no: desabilitar zoom prejudica
         acessibilidade. interactive-widget=resizes-content (Chrome 108+/Safari
         16.4+) faz o teclado virtual encolher o viewport de verdade — nessa
         faixa de navegadores, 100dvh já reflete o teclado aberto sozinho, sem
         depender só do fallback via window.visualViewport (ver cardapio.js). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Tema escuro (só o cardápio do cliente, ver README/tailwind.config
         abaixo) — a cor da barra do navegador/status bar acompanha. -->
    <meta name="theme-color" content="#121212" />
    <title>PapeiAI — Cardápio Digital</title>
    <!-- Open Graph: fallback genérico pra quando alguém compartilha o link
         DIRETO desse arquivo (?slug=...), sem passar pela rota
         /cardapio/:slug (api/cardapio-preview.js) que mostra a foto de cada
         restaurante — crawlers de WhatsApp/redes sociais não executam JS, só
         leem essas tags no HTML bruto, então não dá pra variar por
         restaurante aqui. URL absoluta é obrigatória pra og:image. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PapeiAI — Cardápio Digital" />
    <meta property="og:description" content="Cardápio digital com o Ari, garçom IA — peça sem esperar o garçom." />
    <meta property="og:image" content="https://www.papeiai.com.br/images/og-preview.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // orange vem de uma CSS var (--brand-orange-rgb, ver css/style.css
              // e js/util.js applyThemeColor()) pra poder ser a cor de destaque
              // cadastrada por CADA restaurante (restaurants.theme_color,
              // migration 0012), em vez de fixa — red/blue continuam fixos.
              brand: { orange: 'rgb(var(--brand-orange-rgb) / <alpha-value>)', red: '#E63946', blue: '#2563EB' },
              // Tema escuro do cardápio público: fundo quase-preto com leve
              // calor (não é cinza puro), cartões um tom acima do fundo, e
              // uma borda quase invisível só pra separar o cartão do fundo
              // sem precisar de sombra (sombra não "lê" direito em cima de
              // um fundo já escuro).
              surface: {
                DEFAULT: '#121212',
                card: '#1c1a19',
                raised: '#242120',
                line: 'rgba(255,255,255,0.07)',
              },
            },
            fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          },
        },
      }
    </script>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  </head>
  <body class="bg-surface">
    <div id="root"></div>

    <script src="../config.js"></script>
    <script src="../js/util.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/logo.js"></script>
    <script src="../js/category-icons.js"></script>
    <script src="../js/supabase-client.js"></script>
    <script src="cardapio.js"></script>
  </body>
</html>
