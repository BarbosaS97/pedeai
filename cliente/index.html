<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="../images/favicon.png" />
    <!-- apple-touch-icon: é o que o iOS usa pro ícone quando o cliente faz
         "Adicionar à Tela de Início" a partir do cardápio — Safari ignora o
         manifest.json pra isso, só olha esta tag. -->
    <link rel="apple-touch-icon" href="../images/favicon.png" />
    <link rel="manifest" href="../manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SeuAri" />
    <!-- Avatar do Ari (garçom IA): pré-carregado pra já estar pronto quando o
         cliente abrir o chat, sem "pop-in" da imagem. -->
    <link rel="preload" as="image" href="../images/avatar.png" />
    <!-- viewport-fit=cover libera as variáveis env(safe-area-inset-*), usadas para
         não deixar a barra do carrinho/chat coladas no notch/home indicator do
         celular. Sem maximum-scale/user-scalable=no: desabilitar zoom prejudica
         acessibilidade. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FF6B35" />
    <title>SeuAri — Cardápio Digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: { orange: '#FF6B35', red: '#E63946', purple: '#7C3AED', blue: '#2563EB' },
            },
            fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          },
        },
      }
    </script>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <script src="../config.js"></script>
    <script src="../js/util.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/logo.js"></script>
    <script src="../js/supabase-client.js"></script>
    <script src="cardapio.js"></script>
  </body>
</html>
