<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <!-- viewport-fit=cover libera as variáveis env(safe-area-inset-*), usadas para
         não deixar a barra do carrinho/chat coladas no notch/home indicator do
         celular. Sem maximum-scale/user-scalable=no: desabilitar zoom prejudica
         acessibilidade. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FF6B35" />
    <title>PedeAí — Cardápio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: { orange: '#FF6B35', red: '#E63946', purple: '#7C3AED', blue: '#2563EB' },
            },
            fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          },
        },
      }
    </script>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <script src="../config.js"></script>
    <script src="../js/util.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/logo.js"></script>
    <script src="../js/supabase-client.js"></script>
    <script src="cardapio.js"></script>
  </body>
</html>
